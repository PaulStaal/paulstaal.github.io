<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Watt IV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
    <style>
        :root {
            --secondary: #A0B5CB;
            --quaternary: #C95538;
            --background-dark: #1f1f1f;
            --sandy-dunes: #efe7dd;
            --neutral-light: #f5f5f5;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--background-dark);
            font-family: "Courier New", Courier, monospace;
            color: var(--neutral-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .construction-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            position: relative;
        }

        .logo-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg.logo {
            z-index: 2;
            background: var(--quaternary);
            padding: 20px;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            box-shadow: 0px 3px 5px -1px rgba(0, 0, 0, 0.2),
                0px 6px 10px 0px rgba(0, 0, 0, 0.14),
                0px 1px 18px 0px rgba(0, 0, 0, .12);
            transition: transform 0.3s ease;
            overflow: visible;
        }

        @keyframes logo-pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 96, 56, 0.4);
            }

            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 80px rgba(255, 96, 56, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 96, 56, 0);
            }
        }

        svg.logo {
            animation: logo-pulse 3s infinite ease-in-out;
        }

        svg.logo:hover {
            transform: rotate(10deg);
        }

        svg.text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            z-index: 1;
            pointer-events: none;
            animation: spin-rotate 20s linear infinite;
        }

        svg.text path {
            transform-origin: center;
        }

        @keyframes spin-rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        h1 {
            font-family: "Instrument Serif", serif;
            font-size: 4rem;
            margin: 0;
            font-weight: 400;
            color: var(--neutral-light);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            color: var(--secondary);
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            p {
                padding: 0 20px;
                font-size: 1rem;
            }

            .social-icons {
                flex-direction: column;
                gap: 20px;
            }
        }

        .social-icons {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-icons a {
            color: var(--sandy-dunes);
            opacity: 0.7;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .social-icons a:hover {
            opacity: 1;
            transform: translateY(-2px);
            color: var(--quaternary);
        }
    </style>
</head>

<body>

    <div class="construction-container">

        <div class="logo-wrapper">

                    M 14, 50

                    36,36 0 1,1 -72,0
                "></path>
                <text fill="#f5f5f5" font-size="10.5" letter-spacing="1.2">
                    <textPath href="#circlePath" textLength="220">Watt IV • Watt IV • Watt IV • </textPath>
                </text>
            </svg>
        </div>

        <h1>Under Construction</h1>
        <p>The next chapter begins this Sunday, February 15th. <br><br>Stay tuned.</p>

        </div>
    </div>

</body>
